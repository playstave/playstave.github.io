# Builds Stave and publishes it to GitHub Pages on every push to main.
# Site: https://playstave.github.io/ (a <owner>.github.io repo is served from the root;
# any other repo name is served from /<repo>/).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Work out the site folder
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: npm run build
        env:
          # Public values only (the anon key is designed to be public; row-level security protects data).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional: set these repository variables once AdSense approves the site.
          VITE_ADSENSE_CLIENT: ${{ vars.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT: ${{ vars.VITE_ADSENSE_SLOT }}
          # Optional: set to 1 to tag ad requests for child-directed treatment (COPPA).
          VITE_ADSENSE_CHILD_DIRECTED: ${{ vars.VITE_ADSENSE_CHILD_DIRECTED }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
